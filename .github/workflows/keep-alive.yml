name: Keep Render API awake

on:
  schedule:
    # Render's free tier sleeps an instance after ~15 min without a request; pinging every
    # 10 min keeps it from ever hitting that. GitHub may delay a scheduled run under load, so
    # this isn't a hard guarantee, but in practice it's close enough.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # GitHub can delay a scheduled cron run under load; if that delay pushes us past
          # Render's ~15 min idle threshold, this ping itself becomes a cold start. A cold
          # boot (Docker + the DbUp migration check at startup) can take longer than a quick
          # 30s timeout, so retry a few times with a generous per-attempt timeout before
          # actually failing the workflow.
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 60 https://vidriera-api.onrender.com/api/health; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
