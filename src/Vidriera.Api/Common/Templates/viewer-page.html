<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>{{COMPANY_NAME}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{COMPANY_NAME}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{COVER_IMAGE_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{COMPANY_NAME}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{COVER_IMAGE_URL}}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/src/Style/stPageFlip.css" />
    <link rel="stylesheet" href="/css/catalog-viewer.css" />
</head>
<body>
    <div class="scene-bg"{{SCENE_BG_STYLE}}></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span id="loading-text">Preparando catálogo...</span>
    </div>
    <div class="stage">
        <a id="brand-logo-link" href="/about" target="_blank" rel="noopener" title="Conocé Vidriera">
            <img id="brand-logo" src="/images/vidriera-logo.png" alt="Vidriera" />
        </a>
        <div id="toolbar" class="toolbar" style="display: none;">
            <button id="lens-btn" title="Zoom">&#128269;</button>
            <button id="fullscreen-btn" title="Pantalla completa">&#9974;</button>
            <button id="print-btn" title="Imprimir">&#128424;</button>
            {{INDEX_BUTTON}}
            <button id="share-btn" title="Compartir">&#128228;</button>
            <a id="download-btn" href="{{FILE_URL}}" download title="Descargar PDF">&#11015;</a>
        </div>
        <button id="prev" class="side-nav" title="Anterior" style="display: none;">&#8249;</button>
        <button id="next" class="side-nav" title="Siguiente" style="display: none;">&#8250;</button>
        {{INDEX_PANEL}}
        {{SECTIONS_DATA}}
        {{ORDER_PANEL}}
        <div id="catalog-meta" data-catalog-id="{{CATALOG_ID}}" data-company-id="{{COMPANY_ID}}" data-page-count="{{PAGE_COUNT}}" data-order-fields="{{ORDER_FIELDS_JSON}}" data-has-custom-background="{{HAS_CUSTOM_BACKGROUND}}" style="display: none;"></div>
        <div id="update-banner" class="update-banner" style="display: none;">
            <span>Hay una versión nueva del catálogo.</span>
            <button id="update-banner-btn">Actualizar</button>
        </div>
        <div id="cover-info">
            {{COVER_INFO_HEADING}}
        </div>
        <div id="cover-info-meta">
            {{CATALOG_LABEL_DATE}}
        </div>
        <div id="flipbook"></div>
    </div>
    <div id="page-info" class="page-info"></div>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script type="module" src="/js/catalog-viewer.js"></script>
</body>
</html>
